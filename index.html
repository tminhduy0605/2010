<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE4EE">
<meta name="robots" content="noindex, nofollow">
<title>Hộp quà bí mật 12A1 – 20/10 ✨</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          candy: { DEFAULT: '#FFB9D2', deep: '#E0457F', soft: '#FFE4EE' },
          lav:   { DEFAULT: '#D9C9FF', deep: '#9B7BE8', soft: '#EFE8FF' },
          milk:  '#FFF7EA',
          plum:  { DEFAULT: '#45275C', soft: '#6F5885' }
        },
        fontFamily: {
          display: ['"Baloo 2"', 'Nunito', 'sans-serif'],
          body: ['Nunito', 'sans-serif']
        }
      }
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
:root{
  --candy:#FFB9D2; --candy-deep:#E0457F; --lav:#D9C9FF; --lav-deep:#9B7BE8;
  --milk:#FFF7EA; --plum:#45275C; --plum-soft:#6F5885;
}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}

body{
  min-height:100vh; min-height:100dvh;
  padding:
    calc(env(safe-area-inset-top, 0px) + .8rem)
    calc(env(safe-area-inset-right, 0px) + .8rem)
    calc(env(safe-area-inset-bottom, 0px) + 1.2rem)
    calc(env(safe-area-inset-left, 0px) + .8rem);
  background:
    radial-gradient(30rem 20rem at 90% -5%, #E9DEFF 0, transparent 60%),
    radial-gradient(25rem 20rem at -5% 20%, #FFD7E7 0, transparent 60%),
    linear-gradient(180deg, #FFF1F7 0%, #F3ECFF 50%, #FFF7EA 100%);
  background-attachment:fixed;
  font-family:'Nunito', sans-serif;
  color:var(--plum);
}

/* ---------- Hiệu ứng rơi nền ---------- */
#ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#ambient span{position:absolute;opacity:.8;will-change:transform}
#ambient .fall{top:-10%;animation:fall linear infinite}
#ambient .rise{bottom:-10%;animation:rise linear infinite}
@keyframes fall{from{transform:translate3d(0,-10vh,0) rotate(0)}to{transform:translate3d(var(--dx,20px),110vh,0) rotate(360deg)}}
@keyframes rise{from{transform:translate3d(0,0,0) rotate(-6deg)}50%{transform:translate3d(var(--dx,15px),-50vh,0) rotate(6deg)}to{transform:translate3d(0,-115vh,0) rotate(-6deg)}}

/* ---------- Nút & chip ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:.5rem;
  width:100%; min-height:3.2rem; padding:.6rem 1rem;
  border:2.5px solid var(--plum); border-radius:999px;
  font-family:"Baloo 2", sans-serif; font-weight:800; font-size:1rem; line-height:1.15;
  color:var(--plum); cursor:pointer; text-align:center;
  box-shadow:0 4px 0 var(--plum);
  transition:transform .1s, box-shadow .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--plum)}
.btn:disabled{opacity:.7;cursor:default}
.btn-candy{background:var(--candy)}
.btn-lav{background:var(--lav)}
.btn-milk{background:#fff}
.btn-sm{min-height:2.8rem;font-size:.85rem;padding:.4rem .8rem;box-shadow:0 3px 0 var(--plum)}

.link-btn{
  background:none;border:0;padding:.5rem .75rem;cursor:pointer;
  font-weight:800;font-size:.85rem;color:var(--plum-soft);
  text-decoration:underline;text-underline-offset:3px;
}
.btn:focus-visible,.link-btn:focus-visible,.giftbox:focus-visible,.bigplay:focus-visible{
  outline:3px solid var(--lav-deep);outline-offset:3px;
}

.chip{
  display:inline-block;background:#fff;border:2px solid var(--plum);
  border-radius:999px;padding:.25rem 1rem;font-weight:800;font-size:.85rem;
  box-shadow:0 2px 0 var(--plum);
}

/* ---------- Chuyển bước ---------- */
.step-in{animation:stepIn .35s ease both}
@keyframes stepIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- Hộp quà ---------- */
.giftbox-wrapper{position:relative;width:11rem;height:12rem;margin:1rem auto .5rem}
.giftbox{position:relative;width:100%;height:100%;border:0;background:none;padding:0;cursor:pointer}
.giftbox:disabled{cursor:default}
.gb-all{position:absolute;inset:0;transform-origin:50% 100%;animation:hop 1.7s cubic-bezier(.3,0,.4,1) infinite}
@keyframes hop{
  0%,100%{transform:translateY(0) scale(1.05,.93)}
  28%{transform:translateY(-1.2rem) scale(.96,1.06)}
  50%{transform:translateY(0) scale(1.06,.92)}
  64%{transform:translateY(-.3rem) scale(1,1)}
  78%{transform:translateY(0) scale(1.02,.97)}
}
