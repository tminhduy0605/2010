<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Test & Cơ Cấu</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .system-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
            font-size: 15px;
        }

        .btn-reset:hover {
            background-color: #c0392b;
        }

        .btn-test {
            background-color: #3498db;
            color: white;
        }

        .btn-test:hover {
            background-color: #2980b9;
        }

        .btn-add {
            background-color: #2ecc71;
            color: white;
        }

        .btn-add:hover {
            background-color: #27ae60;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            border: 1fr solid #e1e8ed;
            border-radius: 8px;
            padding: 15px;
            background: #fafbfc;
            border: 1px solid #e2e8f0;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        /* Form cấu hình cơ cấu */
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Danh sách cơ cấu */
        .structure-list {
            list-style: none;
        }

        .structure-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 12px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .btn-delete {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #e74c3c;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .btn-delete:hover {
            background-color: #fadbd8;
        }

        /* Log test */
        .test-log {
            background: #1e293b;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            border-radius: 6px;
            height: 180px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
        }

        .badge-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background: #f1c40f;
            color: #000;
        }

        .badge-status.live {
            background: #2ecc71;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hệ Thống Quản Lý Test & Chạy Thực Tế</h1>

    <!-- Thanh công cụ hệ thống -->
    <div class="system-actions">
        <div>
            Trạng thái hiện tại: <span id="statusBadge" class="badge-status">Đang Test</span>
        </div>
        <button class="btn btn-reset" onclick="handleSystemReset()">
            🔄 BẤM RESET (Bắt đầu chạy thực tế)
        </button>
    </div>

    <div class="grid-layout">
        <!-- Khối 1: Cấu hình Cơ Cấu (KHÔNG BỊ RESET, CHỈ XÓA BẰNG THÙNG RÁC) -->
        <div class="card">
            <h2>1. Cơ Cấu Sơ Đồ ("Ai Xem Ai")</h2>
            
            <div class="form-group">
                <input type="text" id="viewerInput" placeholder="Người xem...">
                <input type="text" id="targetInput" placeholder="Được xem...">
                <button class="btn btn-add" onclick="addStructure()">Thêm</button>
            </div>

            <ul class="structure-list" id="structureList">
                <!-- Danh sách cơ cấu sẽ hiện ở đây -->
            </ul>
        </div>

        <!-- Khối 2: Dữ liệu Test & Lượt chạy (SẼ BỊ RESET KHI BẤM RESET) -->
        <div class="card">
            <h2>2. Dữ Liệu Test / Lượt Tạm Thời</h2>
            <p style="margin-bottom: 10px; font-size: 14px; color: #666;">
                Bấm nút dưới để giả lập phát sinh dữ liệu test:
            </p>
            
            <button class="btn btn-test" onclick="generateTestData()" style="margin-bottom: 15px; width: 100%;">
                ⚡ Giả Lập Tạo Dữ Liệu Test / Lượt Mới
            </button>

            <div class="test-log" id="testLog">
                <!-- Log test hiện ở đây -->
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. DỮ LIỆU BÂN ĐẦU (STATE)
    // ==========================================
    
    // Dữ liệu cơ cấu: ĐƯỢC GIỮ NGUYÊN khi Reset
    let structureData = [
        { id: 1, viewer: "Sếp A", target: "Nhân viên B" },
        { id: 2, viewer: "Trưởng phòng C", target: "Nhóm 1" }
    ];

    // Dữ liệu Test: SẼ BỊ XÓA HOÀN TOÀN khi Reset
    let testLogs = [];
    let isLiveMode = false;

    // ==========================================
    // 2. HIỂN THỊ DỮ LIỆU LÊN GIAO DIỆN (RENDER)
    // ==========================================

    function renderStructureList() {
        const listEl = document.getElementById('structureList');
        listEl.innerHTML = '';

        if (structureData.length === 0) {
            listEl.innerHTML = '<li style="color: #888; font-style: italic; text-align: center; padding: 10px;">Chưa có cơ cấu nào được thiết lập.</li>';
            return;
        }

        structureData.forEach(item => {
            const li = document.createElement('li');
            li.className = 'structure-item';
            li.innerHTML = `
                <span><strong>${item.viewer}</strong> ➔ xem <strong>${item.target}</strong></span>
                <button class="btn-delete" onclick="deleteStructureItem(${item.id})" title="Xóa cơ cấu này">
                    🗑️
                </button>
            `;
            listEl.appendChild(li);
        });
    }

    function renderTestLogs() {
        const logEl = document.getElementById('testLog');
        if (testLogs.length === 0) {
            logEl.innerHTML = '> Chưa có dữ liệu test nào...';
            return;
        }
        logEl.innerHTML = testLogs.map(log => `> ${log}`).join('<br>');
        logEl.scrollTop = logEl.scrollHeight; // Tự cuộn xuống dưới
    }

    // ==========================================
    // 3. LOGIC XỬ LÝ (ACTIONS)
    // ==========================================

    // Thêm Cơ Cấu mới
    function addStructure() {
        const viewer = document.getElementById('viewerInput').value.trim();
        const target = document.getElementById('targetInput').value.trim();

        if (!viewer || !target) {
            alert('Vui lòng nhập đầy đủ Người xem và Người được xem!');
            return;
        }

        const newItem = {
            id: Date.now(),
            viewer: viewer,
            target: target
        };

        structureData.push(newItem);
        
        // Reset form
        document.getElementById('viewerInput').value = '';
        document.getElementById('targetInput').value = '';

        renderStructureList();
    }

    // XÓA TAY CƠ CẤU (Bằng Thùng Rác)
    function deleteStructureItem(id) {
        if (confirm('Bạn có chắc muốn xóa cơ cấu này không?')) {
            structureData = structureData.filter(item => item.id !== id);
            renderStructureList();
        }
    }

    // Tạo dữ liệu test ngẫu nhiên
    function generateTestData() {
        const randomScore = Math.floor(Math.random() * 100) + 1;
        const randomID = Math.floor(Math.random() * 8999) + 1000;
        const time = new Date().toLocaleTimeString();
        
        const logMessage = `[${time}] User_${randomID} | Kết quả test: ${randomScore} điểm | Random Token: #${Math.random().toString(36).substring(7)}`;
        testLogs.push(logMessage);

        renderTestLogs();
    }

    // ==========================================
    // 4. NÚT RESET CHÍNH (ĐÚNG YÊU CẦU CỦA BẠN)
    // ==========================================
    function handleSystemReset() {
        const confirmReset = confirm("Bạn có chắc chắn muốn RESET không?\n- Tất cả dữ liệu TEST sẽ bị xóa sạch và random lại từ đầu.\n- CƠ CẤU XEM SẼ ĐƯỢC GIỮ NGUYÊN.");
        
        if (!confirmReset) return;

        // 1. Xóa sạch dữ liệu test
        testLogs = [];

        // 2. Chuyển trạng thái sang Thực tế
        isLiveMode = true;
        document.getElementById('statusBadge').innerText = "Đang Chạy Thực Tế";
        document.getElementById('statusBadge').className = "badge-status live";

        // 3. Thêm log thông báo vừa Reset thành công
        const time = new Date().toLocaleTimeString();
        testLogs.push(`[${time}] === ĐÃ RESET TỔNG QUAN ===`);
        testLogs.push(`[${time}] Đã xóa toàn bộ dữ liệu test cũ.`);
        testLogs.push(`[${time}] Khởi tạo lại session ngẫu nhiên từ đầu cho Chạy Thực Tế.`);
        testLogs.push(`[${time}] GIỮ NGUYÊN ${structureData.length} cơ cấu "Ai xem ai".`);

        // Update lại giao diện
        renderTestLogs();

        // LƯU Ý: Không đụng tới structureData nên Cơ cấu vẫn được giữ nguyên!
        alert("Đã Reset thành công! Toàn bộ cơ cấu vẫn được bảo lưu.");
    }

    // Khoi tao ban dau
    renderStructureList();
    renderTestLogs();
</script>

</body>
</html>
